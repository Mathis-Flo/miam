<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Expérience RA</title>
    <link rel="stylesheet" href="./css/style.css" />
    <script src="https://aframe.io/releases/1.7.1/aframe.min.js"></script>
    <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>
    <script src="https://unpkg.com/@c-frame/aframe-physics-system@4.2.3/dist/aframe-physics-system.min.js"></script>
  </head>
  <body>
    <a-scene embedded arjs physics>
      <a-marker preset="hiro">
        <a-entity
          position="0 0 0"
          scale="0.1 0.1 0.1"
          gltf-model="./assets/3d/pasta_with_meatballs_and_sausage.glb"
        ></a-entity>
      </a-marker>
      <a-entity camera></a-entity>
    </a-scene>
  </body>
</html>
